name: 機能要望
description: 新しい機能や改善の提案
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: who
    attributes:
      label: 誰が・何をしたいか（ユーザーストーリー）
      placeholder: "大会運営者として、○○したい。なぜなら△△だから。"
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 具体的なイメージ
      description: 画面・コマンド・流れなど
  - type: textarea
    id: done
    attributes:
      label: 完了の条件
      placeholder: |
        - [ ] ○○できる
        - [ ] △△の場合はエラーを表示する
